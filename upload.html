            brand: row[0], name: row[1], area: row[2], division: row[3], 
            phone: row[4], address: row[5], lat: parseFloat(row[6]), lng: parseFloat(row[7]), verified: row[8]
        }));

        window.startUpload = async function() {
            const btn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = "Uploading... Please wait.";
            
            let count = 0;
            try {
                for (const item of showroomsData) {
                    const docId = (item.brand + "-" + item.name).replace(/[^a-zA-Z0-9]/g, "-").toLowerCase();
                    await setDoc(doc(db, "showrooms", docId), item);
                    count++;
                    status.textContent = `Uploaded ${count} of ${showroomsData.length} showrooms...`;
                }
                status.textContent = `✅ Successfully uploaded ${count} showrooms! You can now close this page.`;
                btn.textContent = "Upload Complete";
                status.style.color = "#19c45e";
            } catch (error) {
                console.error("Error uploading: ", error);
                status.textContent = "❌ Error: " + error.message;
                status.style.color = "red";
                btn.disabled = false;
            }
        };
